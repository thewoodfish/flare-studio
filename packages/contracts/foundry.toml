[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = false

# Read-only, and scoped to the shared commitment fixture. The Solidity suite must
# assert against the exact bytes the TypeScript implementation produced -- copying
# the values into a Solidity constant would defeat the purpose, since the copy
# would not notice when the source changed.
fs_permissions = [
  { access = "read", path = "../policy/fixtures" },
  # Deploy.s.sol writes the resolved addresses here so the web app and
  # orchestrator read one generated file rather than each keeping a copy.
  # Without write access this fails *after* broadcast, having already spent gas.
  { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "unused", url = "https://coston2-explorer.flare.network/api" }
